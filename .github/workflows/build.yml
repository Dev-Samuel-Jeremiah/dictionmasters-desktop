# Builds one level's offline installers on GitHub's computers.
# See README.md, "Publishing the installers".
#
# Run it: Actions > "Build installers" > Run workflow, and type the level.
#
# A level with its videos is too big for one installer (Windows installers stop
# at 2 GB), so each level gets its own installers with its pages, pictures and
# recordings inside, and its videos travel beside them in a videos/ folder. The
# website puts the two together into one zip per level for flash drives (its
# /admin/ -> "Offline app downloads"), reading the videos from the release.
#
#   1. Lessons   downloads that level's newest lessons from the website, no videos
#                (secret DM_BUILD_TOKEN = the website's DESKTOP_BUILD_TOKEN)
#   2. Build     Windows 10/11, Windows 7/8 (Electron 22) and Linux, each on its own system
#   3. Publish   (main only) the files on the Releases page, tag "offline":
#                https://github.com/<owner>/<repo>/releases/download/offline/<file>
#                e.g. DictionMasters-Level-1-Setup.exe
#
# Repository settings (Settings > Secrets and variables > Actions):
#   secret   DM_BUILD_TOKEN       required
#   variable DM_SITE_URL          optional, default: siteUrl in app.config.json
#   secret   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD   optional Windows code signing
name: Build installers

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'The level, as the website names it, e.g. "Level 1" or "Pre-Level"'
        required: true
        default: Level 1

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.level }}
  cancel-in-progress: true

env:
  DM_RELEASE: "1"
  DM_SITE_URL: ${{ vars.DM_SITE_URL }}
  DM_LEVEL: ${{ inputs.level }}
  DM_SKIP_VIDEOS: "1"          # the videos travel beside the installers (the website's zip)

jobs:
  lessons:
    name: Download the lessons
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Fetch the newest release from the website
        env:
          DM_BUILD_TOKEN: ${{ secrets.DM_BUILD_TOKEN }}
        run: node scripts/fetch-content.js
      - uses: actions/upload-artifact@v5
        with:
          name: lessons
          path: |
            content/
            app.config.json
          retention-days: 3
          compression-level: 0      # already sealed media; compressing again only wastes time
      # The level's list, published beside its installers: the website packs
      # exactly the videos these installers expect into the level's zip.
      - name: The level's list
        run: |
          mkdir -p list
          cp content/manifest.json "list/DictionMasters-$(echo "$DM_LEVEL" | sed -E 's/[^A-Za-z0-9]+/-/g')-manifest.json"
      - uses: actions/upload-artifact@v5
        with:
          name: installer-list
          path: list/*
          retention-days: 3

  build:
    name: ${{ matrix.name }}
    needs: lessons
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows 10 and 11, os: windows-latest, target: --win, legacy: "" }
          - { name: Windows 7 and 8, os: windows-latest, target: --win, legacy: "1" }
          - { name: Linux, os: ubuntu-24.04, target: --linux, legacy: "" }
    defaults:
      run: { shell: bash }
    env:
      DM_LEGACY: ${{ matrix.legacy }}
      SIGN_LINK: ${{ startsWith(matrix.os, 'windows') && secrets.WIN_CSC_LINK || '' }}
      SIGN_PASSWORD: ${{ startsWith(matrix.os, 'windows') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v5
        with: { name: lessons, path: . }
      - run: npm ci
      - run: npm test
      - name: Build
        run: |
          if [ -n "$SIGN_LINK" ]; then export CSC_LINK="$SIGN_LINK" CSC_KEY_PASSWORD="$SIGN_PASSWORD"; fi
          npx electron-builder --config electron-builder.config.js --publish never ${{ matrix.target }}
      - name: Collect the files
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          shopt -s nullglob
          for f in dist/*.exe dist/*.AppImage dist/*.deb; do cp "$f" "$RUNNER_TEMP/out/"; done
          ls -la "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v5
        with:
          name: installer-${{ matrix.os }}-${{ matrix.legacy == '1' && 'legacy' || 'normal' }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish on the Releases page
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { pattern: installer-*, path: out, merge-multiple: true }
      - name: Version
        run: echo "APP_VERSION=$(node -p "require('./app.config.json').version")" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: offline
          name: Diction Masters offline ${{ env.APP_VERSION }}
          make_latest: false
          files: out/*
          body: |
            Diction Masters for Windows and Linux, one level per installer. Each needs that level's
            videos/ folder beside it and an unlock code made for the computer. Schools get them as one
            zip per level from the website, not from here.
